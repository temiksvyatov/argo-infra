# PostgreSQL configuration for SSL/TLS

# Основные настройки
listen_addresses = '*'
port = 5432
max_connections = 100

# SSL/TLS настройки
ssl = on
ssl_cert_file = '/var/lib/postgresql/ssl-certs/server-cert.pem'
ssl_key_file = '/var/lib/postgresql/ssl-certs/server-key.pem'
ssl_ca_file = '/var/lib/postgresql/ssl-certs/ca-cert.pem'

# Требование клиентских сертификатов
ssl_min_protocol_version = 'TLSv1.2'
ssl_prefer_server_ciphers = on

# Логирование
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_connections = on
log_disconnections = on
log_statement = 'all'

# Память
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
work_mem = 4MB
