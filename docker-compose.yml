services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres-mtls
    environment:
      POSTGRES_PASSWORD: postgres_admin_password
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./certs/ca-cert.pem:/etc/postgresql-certs/ca-cert.pem:ro
      - ./certs/server-cert.pem:/etc/postgresql-certs/server-cert.pem:ro
      - ./certs/server-key.pem:/etc/postgresql-certs/server-key.pem:ro
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  postgres-network:
    driver: bridge
